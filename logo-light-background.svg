<svg width="420" height="132" viewBox="0 0 420 132" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MSComp Soluções em TI</title>
  <desc id="desc">Logotipo vetorial MSComp sem o símbolo de mais, em versão para fundo claro.</desc>
  <defs>
    <linearGradient id="msBlueLight" x1="18" y1="18" x2="108" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18A8F2"/>
      <stop offset="1" stop-color="#0070F3"/>
    </linearGradient>
    <filter id="softShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0070F3" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#softShadowLight)">
    <circle cx="63" cy="72" r="47" fill="url(#msBlueLight)"/>
    <circle cx="31" cy="20" r="8" fill="#18A8F2"/>
    <path d="M34.5 27L45.5 50" stroke="#18A8F2" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="18" y="87" font-family="Arial, Helvetica, sans-serif" font-size="49" font-style="italic" font-weight="800" fill="#FFFFFF" letter-spacing="-5">MS</text>

  <text x="124" y="86" font-family="Arial, Helvetica, sans-serif" font-size="48" font-style="italic" font-weight="800" fill="#101827" letter-spacing="-2">COMP</text>

  <text x="132" y="109" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="italic" font-weight="500" fill="#6B7280" letter-spacing="3.2">Soluções em TI</text>
</svg>
